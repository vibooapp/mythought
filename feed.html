// TIME AGO

function timeAgo(dateString){

  const seconds =
  Math.floor(
    (
      new Date() -
      new Date(dateString)
    ) / 1000
  )

  let interval =
  seconds / 31536000

  if(interval > 1){

    return Math.floor(interval) + "y"

  }

  interval = seconds / 2592000

  if(interval > 1){

    return Math.floor(interval) + "mo"

  }

  interval = seconds / 86400

  if(interval > 1){

    return Math.floor(interval) + "d"

  }

  interval = seconds / 3600

  if(interval > 1){

    return Math.floor(interval) + "h"

  }

  interval = seconds / 60

  if(interval > 1){

    return Math.floor(interval) + "m"

  }

  return "now"

}

async function loadFeed(type){

  const feedPosts =
  document.getElementById(
    "feedPosts"
  )

  feedPosts.innerHTML =
  `
    <div style="
      padding:20px;
      text-align:center;
    ">
      Loading...
    </div>
  `

  // ACTIVE BUTTON

  if(type === "following"){

    document.getElementById(
      "followingBtn"
    ).style.background = "black"

    document.getElementById(
      "followingBtn"
    ).style.background = "black"

    document.getElementById(
      "followingBtn"
    ).style.color = "white"

    document.getElementById(
      "publicBtn"
    ).style.background = "#f3f3f3"

    document.getElementById(
      "publicBtn"
    ).style.color = "black"

  }

  else{

    document.getElementById(
      "publicBtn"
    ).style.background = "black"

    document.getElementById(
      "publicBtn"
    ).style.color = "white"

    document.getElementById(
      "followingBtn"
    ).style.background = "#f3f3f3"

    document.getElementById(
      "followingBtn"
    ).style.color = "black"

  }

  const {
    data:{ user }
  } =
  await supabaseClient.auth.getUser()

  let posts = []

  // PUBLIC POSTS

  if(type === "public"){

    const { data } =
    await supabaseClient
    .from("posts")
    .select("*")
    .order("id", {
      ascending:false
    })

    posts = data || []

  }

  // FOLLOWING POSTS

  else{

    const {
      data:following
    } =
    await supabaseClient
    .from("followers")
    .select("following_id")
    .eq("follower_id", user.id)

    const ids =
    following.map(
      x => x.following_id
    )

    ids.push(user.id)

    const { data } =
    await supabaseClient
    .from("posts")
    .select("*")
    .in("user_id", ids)
    .order("id", {
      ascending:false
    })

    posts = data || []

  }

  feedPosts.innerHTML = ""

  if(posts.length === 0){

    feedPosts.innerHTML =
    `
      <div style="
        padding:20px;
      ">
        No posts
      </div>
    `

    return

  }

  for(const post of posts){

    const { data:profile } =
    await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", post.user_id)
    .single()

    feedPosts.innerHTML +=

    `
      <div class="post">

        <div class="post-top">

          <a
            href="
              user-profile.html?id=${post.user_id}
            "
          >

            <img
              class="avatar"
              src="${
                profile?.avatar_url
                ||
                'https://i.pravatar.cc/150'
              }"
            >

          </a>

          <div class="post-content">

            <div class="username" style="
  display:flex;
  align-items:center;
  gap:5px;
">

  <a
    href="
      user-profile.html?id=${post.user_id}
    "
    style="
      color:black;
      text-decoration:none;
      display:flex;
      align-items:center;
      gap:5px;
    "
  >

    ${
      profile?.username
      ||
      "user"
    }

    ${
      profile?.verified_badge
      ?
      `
        <img
          src="${profile.verified_badge}"
          style="
            width:16px;
            height:16px;
            object-fit:contain;
          "
        >
      `
      :
      ""
    }

  </a>

</div>

            <div class="caption">

              ${
                post.caption
                ||
                ""
              }

            </div>

            ${
              post.image_url

              ?

              `
                <img
                  class="post-image"
                  src="${post.image_url}"
                >
              `

              :

              ""

            }

            <div class="post-actions">

              <span
                class="
                  material-icons
                  action-btn
                  like-btn
                "
                data-post="${
                  post.id
                }"
              >
                favorite_border
              </span>

              <span
                class="
                  material-icons
                  action-btn
                "
              >
                chat_bubble_outline
              </span>

              <span
                class="
                  material-icons
                  action-btn
                "
              >
                repeat
              </span>

              <span
                class="
                  material-icons
                  action-btn
                "
              >
                send
              </span>

            </div>

            <div
              class="likes-count"
              id="likes-${
                post.id
              }"
            >
              0 likes
            </div>

            <div class="comment-box">

              <input
                type="text"
                class="comment-input"
                id="comment-input-${
                  post.id
                }"
                placeholder="Write a comment..."
              >

              <button
                class="comment-send"
                onclick="addComment(${post.id})"
              >
                Post
              </button>

            </div>

            <div
              class="comments-list"
              id="comments-${
                post.id
              }"
            ></div>

          </div>

        </div>

      </div>
    `

  }

  setupLikes()

  for(const post of posts){

    loadComments(post.id)

  }

}

// LIKE SYSTEM

async function setupLikes(){

  const { data:{ user } } =
  await supabaseClient.auth.getUser()

  const likeButtons =
  document.querySelectorAll(
    ".like-btn"
  )

  for(const btn of likeButtons){

    const postId =
    btn.dataset.post

    const { count } =
    await supabaseClient
    .from("likes")
    .select("*", {

      count:"exact",
      head:true

    })
    .eq("post_id", postId)

    document.getElementById(
      `likes-${postId}`
    ).innerText =
    `${count || 0} likes`

    const { data:liked } =
    await supabaseClient
    .from("likes")
    .select("*")
    .eq("post_id", postId)
    .eq("user_id", user.id)
    .maybeSingle()

    if(liked){

      btn.innerText =
      "favorite"

      btn.classList.add(
        "liked"
      )

    }

    btn.addEventListener(
      "click",
      async ()=>{

        if(
          btn.classList.contains(
            "liked"
          )
        ){

          await supabaseClient
          .from("likes")
          .delete()
          .eq("post_id", postId)
          .eq("user_id", user.id)

          btn.innerText =
          "favorite_border"

          btn.classList.remove(
            "liked"
          )

        }

        else{

          await supabaseClient
          .from("likes")
          .insert({

            post_id:postId,
            user_id:user.id

          })

          btn.innerText =
          "favorite"

          btn.classList.add(
            "liked"
          )

        }

        const { count:newCount } =
        await supabaseClient
        .from("likes")
        .select("*", {

          count:"exact",
          head:true

        })
        .eq("post_id", postId)

        document.getElementById(
          `likes-${postId}`
        ).innerText =
        `${newCount || 0} likes`

      }

    )

  }

}

let commentsLimit = {}

async function loadComments(
  postId,
  append = false
){

  const commentsContainer =
  document.getElementById(
    `comments-${postId}`
  )

  // FIRST TIME LIMIT

  if(!commentsLimit[postId]){

    commentsLimit[postId] = 2

  }

  // GET COMMENTS

  const { data:allComments } =
  await supabaseClient
  .from("comments")
  .select("*")
  .eq("post_id", postId)
  .is("parent_id", null)
  .order("id", {
    ascending:false
  })

  if(!append){

    commentsContainer.innerHTML = ""

  }

  if(!allComments){

    return

  }

  // TOTAL COMMENTS

  const totalComments =
  allComments.length

  // SHOW COUNT

  if(!append){

    commentsContainer.innerHTML += `

      <div style="
        font-size:14px;
        font-weight:700;
        margin-top:14px;
        margin-bottom:8px;
      ">
        ${totalComments} comments
      </div>

    `

  }

  // CURRENT LIMIT

  const currentComments =
  allComments.slice(
    0,
    commentsLimit[postId]
  )

  // RENDER COMMENTS

  for(const comment of currentComments){

    // PREVENT DUPLICATE

    if(
      document.getElementById(
        `comment-${comment.id}`
      )
    ){

      continue

    }

    await renderComment(
      comment,
      commentsContainer
    )

  }

  // REMOVE OLD BUTTONS

  const oldButtons =
  commentsContainer.querySelectorAll(
    ".load-more-btn"
  )

  oldButtons.forEach(btn=>{

    btn.remove()

  })

  // SEE MORE

  if(
    totalComments >
    commentsLimit[postId]
  ){

    commentsContainer.innerHTML += `

      <div
        class="load-more-btn"
        onclick="
          loadMoreComments(
            ${postId}
          )
        "
        style="
          color:gray;
          font-size:14px;
          margin-top:12px;
          cursor:pointer;
          font-weight:600;
        "
      >
        See more comments
      </div>

    `

  }

  // LESS MORE

  else if(
    totalComments > 2
  ){

    commentsContainer.innerHTML += `

      <div
        class="load-more-btn"
        onclick="
          showLessComments(
            ${postId}
          )
        "
        style="
          color:gray;
          font-size:14px;
          margin-top:12px;
          cursor:pointer;
          font-weight:600;
        "
      >
        Less comments
      </div>

    `

  }

}

// ======================
// LOAD COMMENTS END
// ======================

async function showMoreComments(postId){

  const commentsContainer =
  document.getElementById(
    `comments-${postId}`
  )

  const { data:comments } =
  await supabaseClient
  .from("comments")
  .select("*")
  .eq("post_id", postId)
  .is("parent_id", null)
  .order("id", {
    ascending:false
  })

  commentsContainer.innerHTML = ""

  for(const comment of comments){

    await renderComment(
      comment,
      commentsContainer
    )

  }

}

  const box =
  document.getElementById(
    `reply-box-${id}`
  )

  if(box.style.display === "flex"){

    box.style.display = "none"

  }

  else{

    box.style.display = "flex"

  }

}

// ======================
// TOGGLE REPLY END
// ======================



// ======================
// ADD COMMENT START
// ======================

async function addComment(postId){

  const { data:{ user } } =
  await supabaseClient.auth.getUser()

  const input =
  document.getElementById(
    `comment-input-${postId}`
  )

  const text =
  input.value.trim()

  if(!text){

    return

  }

  await supabaseClient
  .from("comments")
  .insert({

    post_id:postId,
    user_id:user.id,
    comment:text

  })

  input.value = ""

  loadComments(postId)

}

// ======================
// ADD COMMENT END
// ======================

async function addReply(
  parentId,
  postId
){

  const { data:{ user } } =
  await supabaseClient.auth.getUser()

  const input =
  document.getElementById(
    `reply-input-${parentId}`
  )

  const text =
  input.value.trim()

  if(!text){

    return

  }

  await supabaseClient
  .from("comments")
  .insert({

    post_id:postId,
    user_id:user.id,
    parent_id:parentId,
    comment:text

  })

  loadComments(postId)

}
