<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Thought</title>

<link
href="https://fonts.googleapis.com/icon?family=Material+Icons"
rel="stylesheet"
/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#fff;
  color:#000;
  padding-bottom:80px;
}

/* TOPBAR */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  background:#fff;
  z-index:100;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.top-icons{
  display:flex;
  gap:18px;
}

.top-icons a{
  text-decoration:none;
  color:#000;
}

.material-icons{
  font-size:30px;
}

/* FEED */

.feed{
  width:100%;
}

.post{
  padding:18px;
  border-bottom:1px solid #eee;
}

.post-top{
  display:flex;
  gap:12px;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
}

.post-content{
  width:100%;
}

.username{
  font-weight:bold;
  font-size:15px;
  margin-bottom:6px;
}

.caption{
  font-size:15px;
  line-height:1.5;
  margin-bottom:12px;
}

.post-image{
  width:100%;
  border-radius:18px;
  margin-top:10px;
}

/* ACTIONS */

.post-actions{
  display:flex;
  gap:22px;
  margin-top:14px;
}

.action-btn{
  cursor:pointer;
  font-size:30px;
  user-select:none;
  transition:0.2s;
}

.action-btn:hover{
  transform:scale(1.1);
}

.liked{
  color:red;
}

.likes-count{
  margin-top:10px;
  font-size:14px;
  font-weight:600;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  padding:12px 0;
}

.bottom-nav a{
  color:#000;
  text-decoration:none;
}

.bottom-nav .material-icons{
  font-size:34px;
}



.comment-box{

  display:flex;
  gap:10px;
  margin-top:14px;

}

.comment-input{

  flex:1;
  border:none;
  background:#f3f3f3;
  height:42px;
  border-radius:12px;
  padding:0 14px;
  outline:none;

}

.comment-send{

  border:none;
  background:black;
  color:white;
  border-radius:12px;
  padding:0 16px;
  cursor:pointer;

}

.comments-list{

  margin-top:12px;

}

.single-comment{

  padding:10px 0;
  border-bottom:1px solid #eee;

}

.comment-user{

  font-weight:600;
  font-size:14px;
  margin-bottom:3px;

}

.comment-text{

  font-size:14px;
  line-height:1.4;

}



.comments-wrapper{
  margin-top:14px;
}

.comment-item{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.comment-avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
}

.comment-body{
  flex:1;
}

.comment-top{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.comment-username{
  font-weight:700;
  font-size:14px;
}

.comment-time{
  color:#777;
  font-size:12px;
}

.comment-text{
  margin-top:4px;
  font-size:14px;
  line-height:1.5;
}

.comment-actions{
  display:flex;
  gap:14px;
  margin-top:8px;
}

.comment-action{
  font-size:13px;
  color:#777;
  cursor:pointer;
}

.reply-box{
  margin-top:10px;
  display:none;
  gap:8px;
}

.reply-input{
  flex:1;
  height:38px;
  border:none;
  background:#f3f3f3;
  border-radius:10px;
  padding:0 12px;
}

.reply-btn{
  border:none;
  background:black;
  color:white;
  border-radius:10px;
  padding:0 14px;
}

.replies{
  margin-left:44px;
  margin-top:10px;
}

.show-replies{
  color:#777;
  font-size:13px;
  margin-top:10px;
  cursor:pointer;
  font-weight:600;
}
</style>

</head>

<body>

<!-- TOPBAR -->

<header class="topbar">

  <div class="logo">
    My Thought
  </div>

  <div class="top-icons">

    <a href="search.html">
      <span class="material-icons">
        search
      </span>
    </a>

  </div>

</header>

<!-- FEED -->

<main
class="feed"
id="postsContainer"
>

</main>

<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <a href="feed.html">
    <span class="material-icons">
      home
    </span>
  </a>

  <a href="search.html">
    <span class="material-icons">
      search
    </span>
  </a>

  <a href="create-post.html">
    <span class="material-icons">
      add_circle
    </span>
  </a>

  <a href="profile.html">
    <span class="material-icons">
      person
    </span>
  </a>

</nav>

<script src="assets/js/supabase.js"></script>


  <script>

async function checkUser(){

  const { data:{ user } } =
  await supabaseClient.auth.getUser()

  if(!user){

    window.location.href =
    "login.html"

  }

}

checkUser()

// LOAD POSTS

async function loadPosts(){

  const postsContainer =
  document.getElementById(
    "postsContainer"
  )

  postsContainer.innerHTML =
  `
    <div style="
      padding:20px;
      text-align:center;
    ">
      Loading...
    </div>
  `

  const { data:posts } =
  await supabaseClient
  .from("posts")
  .select("*")
  .order("id", {
    ascending:false
  })

  postsContainer.innerHTML = ""

  if(posts.length === 0){

    postsContainer.innerHTML =
    `
      <div style="
        padding:20px;
      ">
        No posts yet
      </div>
    `

    return

  }

  for(const post of posts){

    // PROFILE

    const { data:profile } =
    await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", post.user_id)
    .single()

    postsContainer.innerHTML +=

    `
      <div class="post">

        <div class="post-top">

          <img
            class="avatar"
            src="${
              profile?.avatar_url
              ||
              'https://i.pravatar.cc/150?img=12'
            }"
          >

          <div class="post-content">

            <!-- USERNAME -->

            <div class="username">

              ${
                profile?.username
                ||
                "user"
              }

            </div>

            <!-- CAPTION -->

            <div class="caption">

              ${
                post.caption
                ||
                ""
              }

            </div>

            <!-- IMAGE -->

            ${
              post.image_url
              ?

              `
                <img
                  class="post-image"
                  src="${post.image_url}"
                >
              `

              :

              ""

            }

            <!-- ACTIONS -->

            <div class="post-actions">

              <!-- LIKE -->

              <span
                class="
                  material-icons
                  action-btn
                  like-btn
                "
                data-post="${
                  post.id
                }"
              >
                favorite_border
              </span>

              <!-- COMMENT -->

              <span class="
                material-icons
                action-btn
              ">
                chat_bubble_outline
              </span>

              <!-- REPOST -->

              <span class="
                material-icons
                action-btn
              ">
                repeat
              </span>

              <!-- SHARE -->

              <span class="
                material-icons
                action-btn
              ">
                send
              </span>

            </div>

            <!-- LIKES -->

            <div
              class="likes-count"
              id="likes-${
                post.id
              }"
            >
              0 likes
            </div>

            <!-- COMMENT BOX -->

            <div class="comment-box">

              <input
                type="text"
                class="comment-input"
                id="comment-input-${
                  post.id
                }"
                placeholder="Write a comment..."
              >

              <button
  class="comment-send"
  onclick="addComment(${post.id})"
>
  Post
</button>

            </div>

            <!-- COMMENTS -->

            <div
              class="comments-list"
              id="comments-${
                post.id
              }"
            ></div>

          </div>

        </div>

      </div>
    `

  }

  // SETUP

  setupLikes()

  // LOAD COMMENTS

  for(const post of posts){

    loadComments(post.id)

  }

}

loadPosts()

// ======================
// LIKE SYSTEM
// ======================

async function setupLikes(){

  const { data:{ user } } =
  await supabaseClient.auth.getUser()

  const likeButtons =
  document.querySelectorAll(
    ".like-btn"
  )

  for(const btn of likeButtons){

    const postId =
    btn.dataset.post

    // COUNT

    const { count } =
    await supabaseClient
    .from("likes")
    .select("*", {

      count:"exact",
      head:true

    })
    .eq("post_id", postId)

    document.getElementById(
      `likes-${postId}`
    ).innerText =
    `${count || 0} likes`

    // CHECK USER LIKE

    const { data:liked } =
    await supabaseClient
    .from("likes")
    .select("*")
    .eq("post_id", postId)
    .eq("user_id", user.id)
    .maybeSingle()

    if(liked){

      btn.innerText =
      "favorite"

      btn.classList.add(
        "liked"
      )

    }

    // CLICK EVENT

    btn.addEventListener(
      "click",
      async ()=>{

        // UNLIKE

        if(
          btn.classList.contains(
            "liked"
          )
        ){

          await supabaseClient
          .from("likes")
          .delete()
          .eq("post_id", postId)
          .eq("user_id", user.id)

          btn.innerText =
          "favorite_border"

          btn.classList.remove(
            "liked"
          )

        }

        // LIKE

        else{

          await supabaseClient
          .from("likes")
          .insert({

            post_id:postId,

            user_id:user.id

          })

          btn.innerText =
          "favorite"

          btn.classList.add(
            "liked"
          )

        }

        // UPDATE COUNT

        const { count:newCount } =
        await supabaseClient
        .from("likes")
        .select("*", {

          count:"exact",
          head:true

        })
        .eq("post_id", postId)

        document.getElementById(
          `likes-${postId}`
        ).innerText =
        `${newCount || 0} likes`

      }

    )

  }

}

// ======================
// LOAD COMMENTS
// ======================

async function loadComments(postId){

  const commentsContainer =
  document.getElementById(
    `comments-${postId}`
  )

  const { data:comments } =
  await supabaseClient
  .from("comments")
  .select("*")
  .eq("post_id", postId)
  .order("id", {
    ascending:false
  })

  commentsContainer.innerHTML = ""

  for(const comment of comments){

    // PROFILE

    const { data:userProfile } =
    await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", comment.user_id)
    .single()

    commentsContainer.innerHTML +=

    `
      <div class="single-comment">

        <div class="comment-user">

          ${
            userProfile?.username
            ||
            "user"
          }

        </div>

        <div class="comment-text">

          ${
            comment.comment
          }

        </div>

      </div>
    `

  }

}

// ======================
// ADD COMMENT
// ======================

async function addComment(postId){

  const { data:{ user } } =
  await supabaseClient.auth.getUser()

  const input =
  document.getElementById(
    `comment-input-${postId}`
  )

  const text =
  input.value.trim()

  if(!text){

    return

  }

  // INSERT

  const { error } =
  await supabaseClient
  .from("comments")
  .insert({

    post_id:postId,

    user_id:user.id,

    comment:text

  })

  if(error){

    alert(error.message)

    return

  }

  // CLEAR

  input.value = ""

  // RELOAD COMMENTS

  loadComments(postId)

}

</script>

</body>
</html>
