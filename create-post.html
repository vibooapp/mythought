<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Post</title>

  <link rel="stylesheet" href="assets/css/theme.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    .create-container{
      padding:20px;
      padding-bottom:100px;
    }

    .create-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:25px;
    }

    .close-btn{
      font-size:30px;
      text-decoration:none;
      color:black;
    }

    .page-title{
      font-size:24px;
      font-weight:600;
    }

    .post-user{
      display:flex;
      gap:12px;
      align-items:flex-start;
    }

    .textarea{
      width:100%;
      border:none;
      outline:none;
      resize:none;
      font-size:18px;
      min-height:120px;
      margin-top:8px;
    }

    .preview-image{
      width:100%;
      border-radius:20px;
      margin-top:15px;
      display:none;
    }

    .post-btn{
      width:100%;
      height:55px;
      border:none;
      background:black;
      color:white;
      border-radius:18px;
      font-size:18px;
      font-weight:600;
      margin-top:20px;
    }

    .upload-btn{
      margin-top:15px;
      display:block;
      font-size:16px;
    }

  </style>

</head>
<body>

  <div class="create-container">

    <div class="create-top">

      <a href="feed.html" class="close-btn">
        ✕
      </a>

      <div class="page-title">
        New Thread
      </div>

      <div></div>

    </div>

    <div class="post-user">

      <img
        id="userAvatar"
        class="avatar"
        src="https://i.pravatar.cc/150?img=12"
      >

      <div style="flex:1">

        <div
          id="username"
          class="username"
        >
          username
        </div>

        <textarea
          id="caption"
          class="textarea"
          placeholder="What's new?"
        ></textarea>

        <input
          type="file"
          id="imageInput"
          accept="image/*"
          class="upload-btn"
        >

        <img
          id="preview"
          class="preview-image"
        >

      </div>

    </div>

    <button
      id="postBtn"
      class="post-btn"
    >
      Post
    </button>

  </div>

  <script src="assets/js/supabase.js"></script>

  <script>

    let currentUser = null

    async function loadUser(){

      const { data:{ user } } =
      await supabaseClient.auth.getUser()

      if(!user){

        window.location.href = "login.html"

        return

      }

      currentUser = user

      const { data:profile } =
      await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .single()

      document.getElementById("username")
      .innerText =
      profile?.username || "user"

      document.getElementById("userAvatar")
      .src =
      profile?.avatar_url ||
      "https://i.pravatar.cc/150?img=12"

    }

    loadUser()

    // IMAGE PREVIEW

    const imageInput =
    document.getElementById("imageInput")

    const preview =
    document.getElementById("preview")

    imageInput.addEventListener("change", ()=>{

      const file = imageInput.files[0]

      if(file){

        preview.src =
        URL.createObjectURL(file)

        preview.style.display = "block"

      }

    })

    // CREATE POST

    document.getElementById("postBtn")
    .addEventListener("click", async ()=>{

      const caption =
      document.getElementById("caption").value

      const imageFile =
      imageInput.files[0]

      let imageUrl = ""

      // IMAGE UPLOAD

      if(imageFile){

        const fileName =
        Date.now() + imageFile.name

        const { error:uploadError } =
        await supabaseClient.storage
        .from("posts")
        .upload(fileName, imageFile)

        if(uploadError){

          alert(uploadError.message)

          return

        }

        const { data } =
        supabaseClient.storage
        .from("posts")
        .getPublicUrl(fileName)

        imageUrl =
        data.publicUrl

      }

      // SAVE POST

      const { error } =
      await supabaseClient
      .from("posts")
      .insert([{

        user_id: currentUser.id,

        caption: caption,

        image_url: imageUrl

      }])

      if(error){

        alert(error.message)

        return

      }

      alert("Posted 🔥")

      window.location.href =
      "feed.html"

    })

  </script>

</body>
</html>
