<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Signup - My Thought</title>

  <link rel="stylesheet" href="assets/css/auth.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body>

  <div class="auth-box">

    <h1>My Thought</h1>

    <p class="subtitle">
      Share your thoughts with the world
    </p>

    <form id="signupForm">

      <input
        type="text"
        id="name"
        placeholder="Full Name"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">
        Create Account
      </button>

    </form>

    <p id="message"></p>

    <a href="login.html">
      Already have account?
    </a>

  </div>

  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>

</body>
</html>
