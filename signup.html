<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Signup - My Thought</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#fafafa;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:40px 16px;
}

/* MAIN BOX */

.auth-box{
  width:100%;
  max-width:360px;
}

/* CARD */

.auth-card{
  background:white;
  border:1px solid #dbdbdb;
  padding:40px 40px 28px;
}

/* LOGO */

.logo{
  text-align:center;
  font-size:42px;
  font-family:cursive;
  margin-bottom:34px;
  font-weight:700;
}

/* FORM */

.auth-form{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.auth-input{
  width:100%;
  height:38px;
  border:1px solid #dbdbdb;
  background:#fafafa;
  padding:0 10px;
  font-size:13px;
  outline:none;
  border-radius:3px;
}

.auth-input:focus{
  border-color:#999;
}

/* BUTTON */

.auth-btn{
  width:100%;
  height:34px;
  border:none;
  border-radius:8px;
  background:black;
  color:white;
  font-size:14px;
  font-weight:700;
  margin-top:10px;
  cursor:pointer;
}

/* DIVIDER */

.divider{
  display:flex;
  align-items:center;
  margin:22px 0;
  gap:16px;
}

.line{
  flex:1;
  height:1px;
  background:#dbdbdb;
}

.or{
  color:#8e8e8e;
  font-size:13px;
  font-weight:700;
}

/* FACEBOOK */

.fb-login{
  text-align:center;
  color:#385185;
  font-size:14px;
  font-weight:700;
  margin-bottom:16px;
  cursor:pointer;
}

/* FORGOT */

.forgot{
  text-align:center;
}

.forgot a{
  text-decoration:none;
  color:#00376b;
  font-size:12px;
}

/* MESSAGE */

#message{
  margin-top:14px;
  text-align:center;
  font-size:13px;
  color:red;
}

/* SIGNIN */

.signup-box{
  margin-top:10px;
  background:white;
  border:1px solid #dbdbdb;
  padding:22px;
  text-align:center;
  font-size:14px;
}

.signup-box a{
  color:#0095f6;
  text-decoration:none;
  font-weight:700;
}


/* FOOTER */

.footer{
  margin-top:40px;
  text-align:center;
  color:#8e8e8e;
  font-size:12px;
  line-height:2;
}

.footer-links{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:14px;
  margin-bottom:14px;
}

.footer-links a{
  text-decoration:none;
  color:#8e8e8e;
}

</style>

</head>

<body>

<div class="auth-box">

  <!-- CARD -->

  <div class="auth-card">

    <!-- LOGO -->

    <div class="logo">
      My Thought
    </div>

    <!-- FORM -->

    <form
      id="signupForm"
      class="auth-form"
    >

      <input
        type="text"
        id="name"
        class="auth-input"
        placeholder="Full Name"
        required
      >

      <input
        type="email"
        id="email"
        class="auth-input"
        placeholder="Email"
        required
      >

      <input
        type="password"
        id="password"
        class="auth-input"
        placeholder="Password"
        required
      >

      <button
        type="submit"
        class="auth-btn"
      >
        Create Account
      </button>

    </form>

    <!-- DIVIDER -->

    <div class="divider">

      <div class="line"></div>

      <div class="or">
        OR
      </div>

      <div class="line"></div>

    </div>

    
    
    <!-- FORGOT -->

    <div class="forgot">

      <a href="#">
        Forgot password?
      </a>

    </div>

    <!-- MESSAGE -->

    <p id="message"></p>

  </div>

  <!-- LOGIN -->

  <div class="signup-box">

    Already have account?

    <a href="login.html">
      Login
    </a>

  </div>

  <!-- APPS -->

  
  <!-- FOOTER -->

  <div class="footer">

    © 2026 MY THOUGHT

  </div>

</div>

<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth.js"></script>

</body>
</html>
