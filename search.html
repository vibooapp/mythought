<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Search</title>

<link
href="https://fonts.googleapis.com/icon?family=Material+Icons"
rel="stylesheet"
/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#fff;
  color:#000;
  padding-bottom:90px;
}

/* TOPBAR */

.topbar{
  display:flex;
  align-items:center;
  gap:14px;
  padding:18px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  background:#fff;
  z-index:100;
}

.back-btn{
  color:black;
  text-decoration:none;
}

.back-btn .material-icons{
  font-size:32px;
}

.page-title{
  font-size:28px;
  font-weight:700;
}

/* SEARCH */

.search-wrapper{
  padding:18px;
}

.search-input{
  width:100%;
  height:55px;
  border:none;
  background:black;
  color:white;
  border-radius:18px;
  padding:0 18px;
  font-size:16px;
  outline:none;
}

.search-input::placeholder{
  color:#bbb;
}

/* FILTERS */

.filters{
  display:flex;
  gap:10px;
  margin-top:20px;
  overflow:auto;
}

.filter-btn{
  border:none;
  background:#f3f3f3;
  color:black;
  padding:10px 18px;
  border-radius:50px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
}

.active-filter{
  background:black;
  color:white;
}

/* USERS */

.users{
  margin-top:18px;
}

.user-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 0;
  border-bottom:1px solid #eee;
}

.user-left{
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  color:black;
  flex:1;
}

.user-avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  object-fit:cover;
}

.user-info{
  flex:1;
}

.user-name{
  font-size:16px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:5px;
}

.user-bio{
  margin-top:4px;
  color:#777;
  font-size:14px;
  line-height:1.4;
}

.follow-btn{
  border:none;
  background:black;
  color:white;
  height:42px;
  padding:0 20px;
  border-radius:14px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.following{
  background:#f3f3f3;
  color:black;
}

.empty-box{
  padding:30px 0;
  color:#777;
  font-size:15px;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  padding:12px 0;
  z-index:999;
}

.bottom-nav a{
  color:#000;
  text-decoration:none;
}

.bottom-nav .material-icons{
  font-size:34px;
}

</style>

</head>

<body>

<!-- TOPBAR -->

<header class="topbar">

  <a
    href="feed.html"
    class="back-btn"
  >
    <span class="material-icons">
      arrow_back
    </span>
  </a>

  <div class="page-title">
    Search
  </div>

</header>

<!-- SEARCH -->

<div class="search-wrapper">

  <input
    type="text"
    id="searchInput"
    class="search-input"
    placeholder="Search users"
  >

  <!-- FILTERS -->

  <div class="filters">

    <button
      class="filter-btn active-filter"
      onclick="changeFilter('suggestions', this)"
    >
      Suggestions
    </button>

    <button
      class="filter-btn"
      onclick="changeFilter('all', this)"
    >
      All Users
    </button>

    <button
      class="filter-btn"
      onclick="changeFilter('popular', this)"
    >
      Popular
    </button>

  </div>

  <!-- USERS -->

  <div
    class="users"
    id="usersContainer"
  ></div>

</div>

<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <a href="feed.html">
    <span class="material-icons">
      home
    </span>
  </a>

  <a href="search.html">
    <span class="material-icons">
      search
    </span>
  </a>

  <a href="create-post.html">
    <span class="material-icons">
      add_circle
    </span>
  </a>

  <a href="profile.html">
    <span class="material-icons">
      person
    </span>
  </a>

</nav>

<script src="assets/js/supabase.js"></script>
<script src="assets/js/create-notification.js"></script>


<script>
  // ======================
// SEARCH PAGE FULL JS
// ======================

let currentUser = null
let currentFilter = "suggestions"

// ======================
// GET CURRENT USER
// ======================

async function getCurrentUser(){

  const {
    data:{ user }
  } =
  await supabaseClient
  .auth
  .getUser()

  if(!user){

    window.location.href =
    "login.html"

    return

  }

  currentUser = user

  loadUsers()

}

getCurrentUser()

// ======================
// CHANGE FILTER
// ======================

function changeFilter(
  filter,
  button
){

  currentFilter = filter

  document
  .querySelectorAll(".filter-btn")
  .forEach(btn=>{

    btn.classList.remove(
      "active-filter"
    )

  })

  button.classList.add(
    "active-filter"
  )

  loadUsers(
    document.getElementById(
      "searchInput"
    ).value
  )

}

// ======================
// LOAD USERS
// ======================

async function loadUsers(
  search = ""
){

  const usersContainer =
  document.getElementById(
    "usersContainer"
  )

  usersContainer.innerHTML =
  `
    <div class="empty-box">
      Loading...
    </div>
  `

  let users = []

  // ======================
  // SEARCH
  // ======================

  if(search.trim() !== ""){

    const { data } =
    await supabaseClient
    .from("profiles")
    .select("*")
    .ilike(
      "username",
      `%${search}%`
    )

    users = data || []

  }

  // ======================
  // SUGGESTIONS
  // ======================

  else if(
    currentFilter ===
    "suggestions"
  ){

    const {
      data:following
    } =
    await supabaseClient
    .from("follows")
    .select("following_id")
    .eq(
      "follower_id",
      currentUser.id
    )

    const followingIds =
    following.map(
      item => item.following_id
    )

    if(
      followingIds.length === 0
    ){

      usersContainer.innerHTML =
      `
        <div class="empty-box">
          No suggestions yet
        </div>
      `

      return

    }

    const { data } =
    await supabaseClient
    .from("profiles")
    .select("*")
    .in(
      "id",
      followingIds
    )

    users = data || []

  }

  // ======================
  // ALL USERS
  // ======================

  else if(
    currentFilter ===
    "all"
  ){

    const { data } =
    await supabaseClient
    .from("profiles")
    .select("*")

    users = data || []

  }

  // ======================
  // POPULAR USERS
  // ======================

  else if(
    currentFilter ===
    "popular"
  ){

    const { data } =
    await supabaseClient
    .from("profiles")
    .select("*")
    .not(
      "verified_badge",
      "is",
      null
    )

    users = data || []

  }

  usersContainer.innerHTML = ""

  // ======================
  // EMPTY
  // ======================

  if(users.length === 0){

    usersContainer.innerHTML =
    `
      <div class="empty-box">
        No users found
      </div>
    `

    return

  }

  // ======================
  // RENDER USERS
  // ======================

  for(const user of users){

    if(
      user.id === currentUser.id
    ){

      continue

    }

    // FOLLOW CHECK

    const {
      data:followData
    } =
    await supabaseClient
    .from("follows")
    .select("*")
    .eq(
      "follower_id",
      currentUser.id
    )
    .eq(
      "following_id",
      user.id
    )
    .maybeSingle()

    const isFollowing =
    !!followData

    usersContainer.innerHTML +=

    `
      <div class="user-card">

        <a
          href="
            user-profile.html?id=${user.id}
          "
          class="user-left"
          onclick="
            saveSearchHistory(
              '${user.id}'
            )
          "
        >

          <img
            class="user-avatar"
            src="${
              user.avatar_url
              ||
              'https://i.pravatar.cc/150'
            }"
          >

          <div class="user-info">

            <div class="user-name">

              ${
                user.username
                ||
                "user"
              }

              ${
                user?.verified_badge
                ?
                `
                  <img
                    src="${user.verified_badge}"
                    style="
                      width:16px;
                      height:16px;
                      object-fit:contain;
                    "
                  >
                `
                :
                ""
              }

            </div>

            <div class="user-bio">

              ${
                user.bio
                ||
                "No bio yet"
              }

            </div>

          </div>

        </a>

        <button
          class="
            follow-btn
            ${
              isFollowing
              ?
              "following"
              :
              ""
            }
          "
          id="follow-${user.id}"
          onclick="
            toggleFollow(
              '${user.id}'
            )
          "
        >

          ${
            isFollowing
            ?
            "Following"
            :
            "Follow"
          }

        </button>

      </div>
    `

  }

}

// ======================
// SEARCH INPUT
// ======================

document
.getElementById(
  "searchInput"
)
.addEventListener(
  "input",
  (e)=>{

    loadUsers(
      e.target.value
    )

  }
)

// ======================
// FOLLOW SYSTEM
// ======================

async function toggleFollow(
  userId
){

  const button =
  document.getElementById(
    `follow-${userId}`
  )

  const {
    data:existing
  } =
  await supabaseClient
  .from("follows")
  .select("*")
  .eq(
    "follower_id",
    currentUser.id
  )
  .eq(
    "following_id",
    userId
  )
  .maybeSingle()

  // ======================
  // UNFOLLOW
  // ======================

  if(existing){

    await supabaseClient
    .from("follows")
    .delete()
    .eq(
      "id",
      existing.id
    )

    // ======================
    // DELETE NOTIFICATION
    // ======================

    await supabaseClient
    .from("notifications")
    .delete()
    .eq("sender_id", currentUser.id)
    .eq("receiver_id", userId)
    .eq("type", "follow")

    button.innerText =
    "Follow"

    button.classList.remove(
      "following"
    )

    return

  }

  // ======================
  // FOLLOW
  // ======================

  await supabaseClient
  .from("follows")
  .insert([{

    follower_id:
    currentUser.id,

    following_id:
    userId

  }])

  // ======================
  // FOLLOW NOTIFICATION
  // ======================

  await createNotification({

    senderId:currentUser.id,

    receiverId:userId,

    type:"follow",

    message:"started following you"

  })

  button.innerText =
  "Following"

  button.classList.add(
    "following"
  )

}

// ======================
// SEARCH HISTORY
// ======================

async function saveSearchHistory(
  userId
){

  await supabaseClient
  .from("search_history")
  .insert([{

    user_id:
    currentUser.id,

    searched_user_id:
    userId

  }])

}
</script>

</body>
</html>
