<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Profile</title>

<link
rel="stylesheet"
href="assets/css/theme.css"
>

<link
href="https://fonts.googleapis.com/icon?family=Material+Icons"
rel="stylesheet"
/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
  margin:0;
  font-family:sans-serif;
  background:white;
  padding-bottom:90px;
}

/* TOPBAR */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px;
}

.logo{
  font-size:28px;
  font-weight:700;
}

.icons{
  display:flex;
  gap:20px;
}

.icons .material-icons{
  font-size:30px;
  cursor:pointer;
}

/* PROFILE */

.profile-section{
  padding:20px;
}

.profile-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:25px;
}

.profile-avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
}

#fullName{
  margin:0;
  font-size:30px;
}

#username{
  color:gray;
  margin-top:5px;
  display:flex;
  align-items:center;
  gap:5px;
  font-size:16px;
}

#bio{
  margin-top:15px;
  font-size:15px;
  line-height:1.5;
}

.stats{
  display:flex;
  gap:18px;
  margin-top:15px;
  font-size:14px;
}

.edit-btn{
  width:100%;
  height:50px;
  border:none;
  border-radius:14px;
  background:black;
  color:white;
  font-size:16px;
  font-weight:600;
  margin-top:20px;
  cursor:pointer;
}

/* POSTS */

.posts-container{
  margin-top:25px;
}

.post-card{
  border-top:1px solid #eee;
  padding:18px 0;
}

.post-top{
  display:flex;
  gap:12px;
}

.post-user-pic{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
}

.post-content{
  flex:1;
}

.post-name{
  font-weight:700;
  font-size:15px;
  display:flex;
  align-items:center;
  gap:5px;
}

.post-caption{
  font-size:15px;
  margin-top:6px;
  line-height:1.5;
}

.post-image{
  width:100%;
  border-radius:18px;
  margin-top:12px;
}

.post-actions{
  display:flex;
  gap:22px;
  margin-top:14px;
}

.action-btn{
  font-size:30px;
  cursor:pointer;
  user-select:none;
}

.liked{
  color:red;
}

.likes-count{
  margin-top:8px;
  font-size:14px;
  font-weight:600;
}

/* COMMENT */

.comment-box{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.comment-input{
  flex:1;
  height:42px;
  border:none;
  background:#f3f3f3;
  border-radius:12px;
  padding:0 14px;
  outline:none;
}

.comment-send-icon{
  font-size:28px;
  cursor:pointer;
  display:flex;
  align-items:center;
}

.comments-list{
  margin-top:14px;
}

.comment-item{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.comment-avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  object-fit:cover;
}

.comment-body{
  flex:1;
}

.comment-top{
  display:flex;
  gap:8px;
  align-items:center;
}

.comment-username{
  font-size:14px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:4px;
}

.comment-time{
  font-size:12px;
  color:gray;
}

.comment-text{
  margin-top:4px;
  font-size:14px;
  line-height:1.5;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  padding:12px 0;
  z-index:999;
}

.bottom-nav a{
  color:#000;
  text-decoration:none;
}

.bottom-nav .material-icons{
  font-size:34px;
}

.blue-tick{
  width:16px;
  height:16px;
  object-fit:contain;
}

</style>

</head>

<body>


<!-- TOP -->

<div class="topbar">

  <div class="logo">
    My Thought
  </div>

  <div class="icons">

    <span
      class="material-icons"
      onclick="window.location.href='search.html'"
    >
      search
    </span>

    <span class="material-icons">
      menu
    </span>

  </div>

</div>

<!-- PROFILE -->

<div class="profile-section">

  <div class="profile-header">

    <div>

      <h1 id="fullName">
        Loading...
      </h1>

      <div id="username">
        @username
      </div>

      <p id="bio">
        No bio yet
      </p>

      <div class="stats">

  <span>
    <b id="postsCount">0</b> posts
  </span>

  <span
    style="cursor:pointer"
    onclick="openFollowModal('followers')"
  >
    <b id="followersCount">0</b> followers
  </span>

  <span
    style="cursor:pointer"
    onclick="openFollowModal('following')"
  >
    <b id="followingCount">0</b> following
  </span>

    </div>

    </div>

    <img
      id="profileImage"
      class="profile-avatar"
      src="https://i.pravatar.cc/150"
    >

  </div>

  <button
    class="edit-btn"
    onclick="
      window.location.href=
      'edit-profile.html'
    "
  >
    Edit Profile
  </button>

  <!-- POSTS -->

  <div
    id="postsContainer"
    class="posts-container"
  ></div>

</div>

<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <a href="feed.html">
    <span class="material-icons">
      home
    </span>
  </a>

  <a href="search.html">
    <span class="material-icons">
      search
    </span>
  </a>

  <a href="create-post.html">
    <span class="material-icons">
      add_circle
    </span>
  </a>

  <a href="profile.html">
    <span class="material-icons">
      person
    </span>
  </a>

</nav>
<!-- FOLLOW MODAL -->

<!-- FOLLOW MODAL -->

<div
  id="followModal"
  style="
    position:fixed;
    inset:0;
    background:white;
    z-index:999999;
    display:none;
    flex-direction:column;
  "
>

  <!-- TOP -->

  <div style="
    display:flex;
    align-items:center;
    gap:15px;
    padding:18px;
    border-bottom:1px solid #eee;
  ">

    <span
      class="material-icons"
      style="cursor:pointer"
      onclick="closeFollowModal()"
    >
      arrow_back
    </span>

    <div
      id="followModalTitle"
      style="
        font-size:20px;
        font-weight:700;
      "
    >
      Followers
    </div>

  </div>

  <!-- TABS -->

  <div style="
    display:flex;
    border-bottom:1px solid #eee;
  ">

    <button
      id="followersTab"
      onclick="switchFollowTab('followers')"
      style="
        flex:1;
        height:50px;
        border:none;
        background:white;
        font-weight:700;
        border-bottom:2px solid black;
      "
    >
      Followers
    </button>

    <button
      id="followingTab"
      onclick="switchFollowTab('following')"
      style="
        flex:1;
        height:50px;
        border:none;
        background:white;
        font-weight:700;
      "
    >
      Following
    </button>

  </div>

  <!-- USERS -->

  <div
    id="followList"
    style="
      flex:1;
      overflow:auto;
      padding:0 16px;
    "
  ></div>

</div>

<script src="assets/js/supabase.js"></script>

<script>

async function loadProfile(){

  const { data:{ user } } =
  await supabaseClient.auth.getUser()

  if(!user){

    window.location.href =
    "login.html"

    return
  }

  // PROFILE

  const { data:profile } =
  await supabaseClient
  .from("profiles")
  .select("*")
  .eq("id", user.id)
  .single()

  // PROFILE UI

  document.getElementById(
    "fullName"
  ).innerText =

  profile?.full_name || "User"

  document.getElementById(
    "username"
  ).innerHTML =

  `
    @${profile?.username || "user"}

    ${
      profile?.verified_badge
      ?
      `
        <img
          src="${profile.verified_badge}"
          class="blue-tick"
        >
      `
      :
      ""
    }
  `

  document.getElementById(
    "bio"
  ).innerText =

  profile?.bio ||
  "No bio yet"

  document.getElementById(
    "profileImage"
  ).src =

  profile?.avatar_url ||
  "https://i.pravatar.cc/150"

  // POSTS COUNT

  const { count } =
  await supabaseClient
  .from("posts")
  .select("*", {
    count:"exact",
    head:true
  })
  .eq("user_id", user.id)

  document.getElementById(
    "postsCount"
  ).innerText = count || 0

  // FOLLOWERS

  const {
    count:followerCount
  } =
  await supabaseClient
  .from("follows")
  .select("*", {
    count:"exact",
    head:true
  })
  .eq("following_id", user.id)

  document.getElementById(
    "followersCount"
  ).innerText =
  followerCount || 0

  // FOLLOWING

  const {
    count:followingCount
  } =
  await supabaseClient
  .from("follows")
  .select("*", {
    count:"exact",
    head:true
  })
  .eq("follower_id", user.id)

  document.getElementById(
    "followingCount"
  ).innerText =
  followingCount || 0

  // POSTS

  const { data:posts } =
  await supabaseClient
  .from("posts")
  .select("*")
  .eq("user_id", user.id)
  .order("id", {
    ascending:false
  })

  const postsContainer =
  document.getElementById(
    "postsContainer"
  )

  postsContainer.innerHTML = ""

  for(const post of posts){

    // LIKE COUNT

    const { count:likesCount } =
    await supabaseClient
    .from("likes")
    .select("*", {
      count:"exact",
      head:true
    })
    .eq("post_id", post.id)

    // CHECK LIKE

    const { data:liked } =
    await supabaseClient
    .from("likes")
    .select("*")
    .eq("post_id", post.id)
    .eq("user_id", user.id)
    .maybeSingle()

    postsContainer.innerHTML += `

      <div class="post-card">

        <div class="post-top">

          <img
            class="post-user-pic"
            src="${
              profile?.avatar_url ||
              'https://i.pravatar.cc/150'
            }"
          >

          <div class="post-content">

            <div class="post-name">

              ${
                profile?.username ||
                "user"
              }

              ${
                profile?.verified_badge
                ?
                `
                  <img
                    src="${profile.verified_badge}"
                    class="blue-tick"
                  >
                `
                :
                ""
              }

            </div>

            <div class="post-caption">

              ${
                post.caption || ""
              }

            </div>

            ${
              post.image_url
              ?
              `
                <img
                  class="post-image"
                  src="${post.image_url}"
                >
              `
              :
              ""
            }

            <div class="post-actions">

              <span
                class="
                  material-icons
                  action-btn
                  like-btn
                  ${
                    liked ? "liked" : ""
                  }
                "
                data-post="${post.id}"
              >
                ${
                  liked
                  ?
                  "favorite"
                  :
                  "favorite_border"
                }
              </span>

              <span
                class="
                  material-icons
                  action-btn
                "
              >
                chat_bubble_outline
              </span>

              <span
                class="
                  material-icons
                  action-btn
                "
              >
                repeat
              </span>

              <span
                class="
                  material-icons
                  action-btn
                "
              >
                send
              </span>

            </div>

            <div
              class="likes-count"
              id="likes-${post.id}"
            >
              ${
                likesCount || 0
              } likes
            </div>

            <!-- COMMENT BOX -->

            <div class="comment-box">

              <input
                type="text"
                class="comment-input"
                id="comment-input-${post.id}"
                placeholder="Write a comment..."
              >

              <span
                class="
                  material-icons
                  comment-send-icon
                "
                onclick="addComment(${post.id})"
              >
                near_me
              </span>

            </div>

            <!-- COMMENTS -->

            <div
              class="comments-list"
              id="comments-${post.id}"
            ></div>

          </div>

        </div>

      </div>

    `

    loadComments(post.id)

  }

  setupLikes()

}

loadProfile()

// ====================
// LIKE SYSTEM
// ====================

async function setupLikes(){

  const { data:{ user } } =
  await supabaseClient.auth.getUser()

  const likeButtons =
  document.querySelectorAll(
    ".like-btn"
  )

  for(const btn of likeButtons){

    btn.addEventListener(
      "click",
      async ()=>{

        const postId =
        btn.dataset.post

        // REMOVE LIKE

        if(
          btn.classList.contains(
            "liked"
          )
        ){

          await supabaseClient
          .from("likes")
          .delete()
          .eq("post_id", postId)
          .eq("user_id", user.id)

          btn.classList.remove(
            "liked"
          )

          btn.innerText =
          "favorite_border"

        }

        // ADD LIKE

        else{

          await supabaseClient
          .from("likes")
          .insert({

            post_id:postId,
            user_id:user.id

          })

          btn.classList.add(
            "liked"
          )

          btn.innerText =
          "favorite"

        }

        // UPDATE LIKE COUNT

        const {
          count:newCount
        } =
        await supabaseClient
        .from("likes")
        .select("*", {
          count:"exact",
          head:true
        })
        .eq("post_id", postId)

        document.getElementById(
          `likes-${postId}`
        ).innerText =

        `${newCount || 0} likes`

      }
    )

  }

}

// ====================
// LOAD COMMENTS
// ====================

async function loadComments(postId){

  const commentsContainer =
  document.getElementById(
    `comments-${postId}`
  )

  const { data:comments } =
  await supabaseClient
  .from("comments")
  .select("*")
  .eq("post_id", postId)
  .order("id", {
    ascending:false
  })

  commentsContainer.innerHTML = ""

  if(!comments){

    return
  }

  for(const comment of comments){

    const { data:userProfile } =
    await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", comment.user_id)
    .single()

    commentsContainer.innerHTML += `

      <div class="comment-item">

        <img
          class="comment-avatar"
          src="${
            userProfile?.avatar_url ||
            'https://i.pravatar.cc/150'
          }"
        >

        <div class="comment-body">

          <div class="comment-top">

            <div class="comment-username">

              ${
                userProfile?.username ||
                "user"
              }

              ${
                userProfile?.verified_badge
                ?
                `
                  <img
                    src="${userProfile.verified_badge}"
                    class="blue-tick"
                  >
                `
                :
                ""
              }

            </div>

            <div class="comment-time">
              now
            </div>

          </div>

          <div class="comment-text">

            ${comment.comment}

          </div>

        </div>

      </div>

    `

  }

}

// ====================
// ADD COMMENT
// ====================

async function addComment(postId){

  const { data:{ user } } =
  await supabaseClient.auth.getUser()

  const input =
  document.getElementById(
    `comment-input-${postId}`
  )

  const text =
  input.value.trim()

  if(!text){

    return
  }

  await supabaseClient
  .from("comments")
  .insert({

    post_id:postId,
    user_id:user.id,
    comment:text

  })

  input.value = ""

  loadComments(postId)

}










let currentFollowTab = "followers"

// ======================
// OPEN MODAL
// ======================

async function openFollowModal(type){

  document.getElementById(
    "followModal"
  ).style.display = "flex"

  currentFollowTab = type

  loadFollowUsers()

}

// ======================
// SWITCH TAB
// ======================

function switchFollowTab(type){

  currentFollowTab = type

  loadFollowUsers()

}

// ======================
// CLOSE MODAL
// ======================

function closeFollowModal(){

  document.getElementById(
    "followModal"
  ).style.display = "none"

}

// ======================
// LOAD USERS
// ======================

async function loadFollowUsers(){

  const list =
  document.getElementById(
    "followList"
  )

  const followersTab =
  document.getElementById(
    "followersTab"
  )

  const followingTab =
  document.getElementById(
    "followingTab"
  )

  // ACTIVE TAB UI

  followersTab.style.borderBottom =
  currentFollowTab === "followers"
  ? "2px solid black"
  : "none"

  followingTab.style.borderBottom =
  currentFollowTab === "following"
  ? "2px solid black"
  : "none"

  list.innerHTML = `
    <div style="
      padding:20px;
      text-align:center;
      color:gray;
    ">
      Loading...
    </div>
  `

  const {
    data:{ user:currentUser }
  } =
  await supabaseClient
  .auth
  .getUser()

  let ids = []

  // FOLLOWERS

  if(currentFollowTab === "followers"){

    const { data } =
    await supabaseClient
    .from("follows")
    .select("follower_id")
    .eq(
      "following_id",
      currentUser.id
    )

    ids =
    data?.map(
      item => item.follower_id
    ) || []

  }

  // FOLLOWING

  else{

    const { data } =
    await supabaseClient
    .from("follows")
    .select("following_id")
    .eq(
      "follower_id",
      currentUser.id
    )

    ids =
    data?.map(
      item => item.following_id
    ) || []

  }

  // EMPTY

  if(ids.length === 0){

    list.innerHTML = `
      <div style="
        padding:30px;
        text-align:center;
        color:gray;
      ">
        No users found
      </div>
    `

    return

  }

  // GET USERS

  const { data:profiles } =
  await supabaseClient
  .from("profiles")
  .select("*")
  .in("id", ids)

  list.innerHTML = ""

  // RENDER USERS

  for(const profile of profiles){

    // FOLLOW CHECK

    const {
      data:followData
    } =
    await supabaseClient
    .from("follows")
    .select("*")
    .eq(
      "follower_id",
      currentUser.id
    )
    .eq(
      "following_id",
      profile.id
    )
    .maybeSingle()

    const isFollowing =
    !!followData

    list.innerHTML += `

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:14px 0;
        border-bottom:1px solid #eee;
      ">

        <a
          href="
            user-profile.html?id=${profile.id}
          "
          style="
            display:flex;
            gap:12px;
            text-decoration:none;
            color:black;
            flex:1;
          "
        >

          <img
            src="${
              profile.avatar_url
              ||
              'https://i.pravatar.cc/150'
            }"
            style="
              width:52px;
              height:52px;
              border-radius:50%;
              object-fit:cover;
            "
          >

          <div>

            <div style="
              display:flex;
              align-items:center;
              gap:5px;
              font-weight:700;
            ">

              ${
                profile.username
                ||
                "user"
              }

              ${
                profile.verified_badge
                ?
                `
                  <img
                    src="${profile.verified_badge}"
                    style="
                      width:16px;
                      height:16px;
                    "
                  >
                `
                :
                ""
              }

            </div>

            <div style="
              color:gray;
              font-size:13px;
              margin-top:4px;
            ">
              ${
                profile.full_name
                ||
                ""
              }
            </div>

          </div>

        </a>

        ${
          profile.id !== currentUser.id
          ?
          `
            <button
              id="follow-btn-${profile.id}"
              onclick="toggleFollowUser('${profile.id}')"
              style="
                border:none;
                height:38px;
                padding:0 18px;
                border-radius:10px;
                font-weight:700;
                cursor:pointer;
                background:${
                  isFollowing
                  ? '#eee'
                  : '#0095f6'
                };
                color:${
                  isFollowing
                  ? 'black'
                  : 'white'
                };
              "
            >
              ${
                isFollowing
                ? "Following"
                : "Follow"
              }
            </button>
          `
          :
          ""
        }

      </div>

    `

  }

}

// ======================
// FOLLOW TOGGLE
// ======================

async function toggleFollowUser(userId){

  const {
    data:{ user }
  } =
  await supabaseClient
  .auth
  .getUser()

  const button =
  document.getElementById(
    `follow-btn-${userId}`
  )

  const {
    data:existing
  } =
  await supabaseClient
  .from("follows")
  .select("*")
  .eq(
    "follower_id",
    user.id
  )
  .eq(
    "following_id",
    userId
  )
  .maybeSingle()

  // UNFOLLOW

  if(existing){

    await supabaseClient
    .from("follows")
    .delete()
    .eq(
      "id",
      existing.id
    )

    button.innerText =
    "Follow"

    button.style.background =
    "#0095f6"

    button.style.color =
    "white"

  }

  // FOLLOW

  else{

    await supabaseClient
    .from("follows")
    .insert([{

      follower_id:user.id,
      following_id:userId

    }])

    button.innerText =
    "Following"

    button.style.background =
    "#eee"

    button.style.color =
    "black"

  }

}

</script>

</body>
</html>
