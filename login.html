<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Login - My Thought</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#fafafa;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

/* MAIN */

.auth-box{
  width:100%;
  max-width:360px;
}

/* CARD */

.auth-card{
  background:white;
  border:1px solid #dbdbdb;
  padding:45px 40px 30px;
}

/* LOGO */

.logo{
  text-align:center;
  font-size:42px;
  font-family:cursive;
  font-weight:700;
  margin-bottom:14px;
}

.subtitle{
  text-align:center;
  color:#8e8e8e;
  font-size:14px;
  margin-bottom:30px;
}

/* FORM */

.auth-form{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.auth-input{
  width:100%;
  height:42px;
  border:1px solid #dbdbdb;
  background:#fafafa;
  border-radius:4px;
  padding:0 12px;
  font-size:13px;
  outline:none;
}

.auth-input:focus{
  border-color:#999;
}

/* BUTTON */

.auth-btn{
  width:100%;
  height:38px;
  border:none;
  border-radius:8px;
  background:black;
  color:white;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  margin-top:12px;
}

/* MESSAGE */

#message{
  margin-top:16px;
  text-align:center;
  font-size:13px;
  color:red;
}

/* SIGNUP */

.signup-box{
  background:white;
  border:1px solid #dbdbdb;
  margin-top:12px;
  padding:22px;
  text-align:center;
  font-size:14px;
}

.signup-box a{
  text-decoration:none;
  color:#0095f6;
  font-weight:700;
}


/* DIVIDER */

.divider{
  display:flex;
  align-items:center;
  margin:22px 0;
  gap:16px;
}

.line{
  flex:1;
  height:1px;
  background:#dbdbdb;
}

.or{
  color:#8e8e8e;
  font-size:13px;
  font-weight:700;
}


/* FORGOT */

.forgot{
  text-align:center;
}

.forgot a{
  text-decoration:none;
  color:#00376b;
  font-size:12px;
}

/* MESSAGE */

#message{
  margin-top:14px;
  text-align:center;
  font-size:13px;
  color:red;
}


/* FOOTER */

.footer{
  margin-top:40px;
  text-align:center;
  color:#8e8e8e;
  font-size:12px;
  line-height:2;
}

.footer-links{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:14px;
  margin-bottom:14px;
}

.footer-links a{
  text-decoration:none;
  color:#8e8e8e;
}


</style>

</head>

<body>

<div class="auth-box">

  <!-- LOGIN CARD -->

  <div class="auth-card">

    <div class="logo">
      My Thought
    </div>

    <div class="subtitle">
      Login to continue
    </div>

    <!-- FORM -->

    <form
      id="loginForm"
      class="auth-form"
    >

      <input
        type="email"
        id="email"
        class="auth-input"
        placeholder="Email"
        required
      >

      <input
        type="password"
        id="password"
        class="auth-input"
        placeholder="Password"
        required
      >

      <button
        type="submit"
        class="auth-btn"
      >
        Login
      </button>

    </form>


    <!-- DIVIDER -->

    <div class="divider">

      <div class="line"></div>

      <div class="or">
        OR
      </div>

      <div class="line"></div>

    </div>

    
    
    <!-- FORGOT -->

    <div class="forgot">

      <a href="#">
        Forgot password?
      </a>

    </div>

    <p id="message"></p>

  </div>

  <!-- CREATE ACCOUNT -->

  <div class="signup-box">

    Don't have an account?

    <a href="signup.html">
      Sign up
    </a>

  </div>
   <!-- FOOTER -->

  <div class="footer">

    © 2026 MY THOUGHT 

  </div>

</div>

<script src="assets/js/supabase.js"></script>
<script src="assets/js/login.js"></script>

</body>
</html>
