<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - My Thought</title>

  <link rel="stylesheet" href="assets/css/auth.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body>

  <div class="auth-box">

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Login to continue
    </p>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="Email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

    <p id="message"></p>

    <a href="signup.html">
      Create New Account
    </a>

  </div>

  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/login.js"></script>

</body>
</html>
