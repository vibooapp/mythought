<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>User Profile</title>

<link
href="https://fonts.googleapis.com/icon?family=Material+Icons"
rel="stylesheet"
/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#fff;
  color:#000;
  padding-bottom:90px;
}

/* TOPBAR */

.topbar{
  height:60px;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:14px;
  position:sticky;
  top:0;
  background:white;
  z-index:100;
}

.back-btn{
  font-size:28px;
  cursor:pointer;
}

.top-username{
  font-size:20px;
  font-weight:700;
}

/* PROFILE */

.profile-section{
  padding:20px;
}

.profile-header{
  display:flex;
  gap:20px;
  align-items:center;
}

.profile-avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
}

.profile-stats{
  flex:1;
  display:flex;
  justify-content:space-around;
}

.stat{
  text-align:center;
  cursor:pointer;
}

.stat-number{
  font-size:20px;
  font-weight:700;
}

.stat-label{
  font-size:14px;
}

.profile-name{
  margin-top:18px;
  font-size:18px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:5px;
}

.profile-bio{
  margin-top:8px;
  line-height:1.5;
  color:#444;
}

.profile-buttons{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.follow-btn,
.message-btn{
  flex:1;
  height:42px;
  border:none;
  border-radius:12px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

.follow-btn{
  background:black;
  color:white;
}

.message-btn{
  background:#f3f3f3;
}

/* POSTS */

.posts-feed{
  margin-top:12px;
}

.post{
  padding:18px;
  border-top:1px solid #eee;
}

.post-top{
  display:flex;
  gap:12px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
}

.post-content{
  flex:1;
}

.username{
  font-size:15px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:5px;
}

.caption{
  margin-top:6px;
  line-height:1.5;
  font-size:14px;
}

.post-image{
  width:100%;
  border-radius:14px;
  margin-top:10px;
}

.post-actions{
  display:flex;
  gap:18px;
  margin-top:12px;
}

.action-btn{
  font-size:28px;
  cursor:pointer;
}

.counts{
  margin-top:10px;
  font-size:14px;
  font-weight:600;
}

.liked{
  color:red;
}

.blue-tick{
  width:16px;
  height:16px;
  object-fit:contain;
}

/* FOLLOW MODAL */

.follow-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:99999;
  justify-content:flex-end;
  flex-direction:column;
}

.follow-box{
  background:white;
  border-radius:22px 22px 0 0;
  height:80vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.follow-tabs{
  display:flex;
  border-bottom:1px solid #eee;
}

.follow-tab{
  flex:1;
  text-align:center;
  padding:16px;
  font-weight:700;
  cursor:pointer;
  color:gray;
}

.follow-tab.active{
  color:black;
  border-bottom:2px solid black;
}

.follow-search{
  padding:14px;
  border-bottom:1px solid #eee;
}

.follow-search input{
  width:100%;
  height:42px;
  border:none;
  background:#f3f3f3;
  border-radius:12px;
  padding:0 14px;
  outline:none;
}

.follow-list{
  flex:1;
  overflow:auto;
}

.follow-user{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
}

.follow-left{
  display:flex;
  gap:12px;
  align-items:center;
  text-decoration:none;
  color:black;
}

.follow-avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
}

.follow-info{
  display:flex;
  flex-direction:column;
}

.follow-name{
  display:flex;
  align-items:center;
  gap:5px;
  font-weight:700;
}

.follow-username{
  color:gray;
  font-size:13px;
}

.follow-action{
  height:36px;
  border:none;
  border-radius:10px;
  padding:0 18px;
  background:black;
  color:white;
  font-weight:700;
  cursor:pointer;
}

.following-btn{
  background:#f3f3f3;
  color:black;
}

.close-modal{
  position:absolute;
  top:14px;
  right:14px;
  background:white;
  border-radius:50%;
  padding:4px;
  cursor:pointer;
}

</style>

</head>

<body>

<!-- TOPBAR -->

<div class="topbar">

  <span
    class="material-icons back-btn"
    onclick="history.back()"
  >
    arrow_back
  </span>

  <div
    class="top-username"
    id="topUsername"
  >
    user
  </div>

</div>

<!-- PROFILE -->

<div class="profile-section">

  <div class="profile-header">

    <img
      id="profileAvatar"
      class="profile-avatar"
      src=""
    >

    <div class="profile-stats">

      <div
        class="stat"
        onclick="openFollowModal('posts')"
      >

        <div
          class="stat-number"
          id="postsCount"
        >
          0
        </div>

        <div class="stat-label">
          Posts
        </div>

      </div>

      <div
        class="stat"
        onclick="openFollowModal('followers')"
      >

        <div
          class="stat-number"
          id="followersCount"
        >
          0
        </div>

        <div class="stat-label">
          Followers
        </div>

      </div>

      <div
        class="stat"
        onclick="openFollowModal('following')"
      >

        <div
          class="stat-number"
          id="followingCount"
        >
          0
        </div>

        <div class="stat-label">
          Following
        </div>

      </div>

    </div>

  </div>

  <div
    class="profile-name"
    id="profileName"
  >
    user
  </div>

  <div
    class="profile-bio"
    id="profileBio"
  >
    No bio yet
  </div>

  <div class="profile-buttons">

    <button
      class="follow-btn"
      id="followBtn"
    >
      Follow
    </button>

    <button class="message-btn">
      Message
    </button>

  </div>

</div>

<!-- POSTS -->

<div
  class="posts-feed"
  id="postsFeed"
></div>

<!-- FOLLOW MODAL -->

<div
  class="follow-modal"
  id="followModal"
>

  <div class="follow-box">

    <div
      class="close-modal"
      onclick="closeFollowModal()"
    >
      <span class="material-icons">
        close
      </span>
    </div>

    <div class="follow-tabs">

      <div
        id="followersTab"
        class="follow-tab active"
        onclick="switchTab('followers')"
      >
        Followers
      </div>

      <div
        id="followingTab"
        class="follow-tab"
        onclick="switchTab('following')"
      >
        Following
      </div>

    </div>

    <div class="follow-search">

      <input
        type="text"
        placeholder="Search"
      >

    </div>

    <div
      class="follow-list"
      id="followList"
    ></div>

  </div>

</div>

<script src="assets/js/supabase.js"></script>
<script src="assets/js/create-notification.js"></script>

<script>
    // ============================
// USER PROFILE FULL JS FIXED
// ============================

const params =
new URLSearchParams(
  window.location.search
)

const userId =
params.get("id")

let currentTab =
"followers"

loadProfile()

// =====================
// LOAD PROFILE
// =====================

async function loadProfile(){

  const {
    data:{ user }
  } =
  await supabaseClient
  .auth
  .getUser()

  // PROFILE

  const {
    data:profile
  } =
  await supabaseClient
  .from("profiles")
  .select("*")
  .eq("id", userId)
  .single()

  if(!profile){
    return
  }

  document.getElementById(
    "profileAvatar"
  ).src =

  profile.avatar_url ||
  "https://i.pravatar.cc/150"

  document.getElementById(
    "profileName"
  ).innerHTML =

  `
    ${profile.username || "user"}

    ${
      profile.verified_badge
      ?
      `
        <img
          src="${profile.verified_badge}"
          class="blue-tick"
        >
      `
      :
      ""
    }
  `

  document.getElementById(
    "topUsername"
  ).innerText =

  profile.username ||
  "user"

  document.getElementById(
    "profileBio"
  ).innerText =

  profile.bio ||
  "No bio yet"

  // =====================
  // POSTS
  // =====================

  const {
    data:posts
  } =
  await supabaseClient
  .from("posts")
  .select("*")
  .eq("user_id", userId)
  .order("id",{
    ascending:false
  })

  document.getElementById(
    "postsCount"
  ).innerText =
  posts?.length || 0

  // =====================
  // FOLLOWERS COUNT
  // =====================

  const {
    count:followersCount
  } =
  await supabaseClient
  .from("follows")
  .select("*",{
    count:"exact",
    head:true
  })
  .eq("following_id", userId)

  document.getElementById(
    "followersCount"
  ).innerText =
  followersCount || 0

  // =====================
  // FOLLOWING COUNT
  // =====================

  const {
    count:followingCount
  } =
  await supabaseClient
  .from("follows")
  .select("*",{
    count:"exact",
    head:true
  })
  .eq("follower_id", userId)

  document.getElementById(
    "followingCount"
  ).innerText =
  followingCount || 0

  // =====================
  // FOLLOW BUTTON
  // =====================

  const followBtn =
  document.getElementById(
    "followBtn"
  )

  if(user.id === userId){

    followBtn.style.display =
    "none"

  }

  else{

    const {
      data:followData
    } =
    await supabaseClient
    .from("follows")
    .select("*")
    .eq("follower_id", user.id)
    .eq("following_id", userId)
    .maybeSingle()

    let isFollowing =
    !!followData

    updateFollowBtn()

    followBtn.onclick =
    async ()=>{

      followBtn.disabled = true

      // =====================
      // UNFOLLOW
      // =====================

      if(isFollowing){

        await supabaseClient
        .from("follows")
        .delete()
        .eq("follower_id", user.id)
        .eq("following_id", userId)

        isFollowing = false

      }

      // =====================
      // FOLLOW
      // =====================

      else{

        await supabaseClient
        .from("follows")
        .insert([{

          follower_id:user.id,
          following_id:userId

        }])

        // =====================
        // NOTIFICATION
        // =====================

        await createNotification({

          senderId:user.id,

          receiverId:userId,

          type:"follow",

          message:"started following you"

        })

        isFollowing = true

      }

      updateFollowBtn()

      followBtn.disabled = false

      loadProfile()

    }

    function updateFollowBtn(){

      if(isFollowing){

        followBtn.innerText =
        "Following"

        followBtn.classList.add(
          "following-btn"
        )

      }

      else{

        followBtn.innerText =
        "Follow"

        followBtn.classList.remove(
          "following-btn"
        )

      }

    }

  }

  // =====================
  // POSTS UI
  // =====================

  const postsFeed =
  document.getElementById(
    "postsFeed"
  )

  postsFeed.innerHTML = ""

  for(const post of posts){

    // =====================
    // LIKE COUNT
    // =====================

    const {
      count:likesCount
    } =
    await supabaseClient
    .from("likes")
    .select("*",{
      count:"exact",
      head:true
    })
    .eq("post_id", post.id)

    // =====================
    // USER LIKED
    // =====================

    const {
      data:likedData
    } =
    await supabaseClient
    .from("likes")
    .select("*")
    .eq("post_id", post.id)
    .eq("user_id", user.id)
    .maybeSingle()

    const liked =
    !!likedData

    postsFeed.innerHTML += `

      <div class="post">

        <div class="post-top">

          <img
            class="avatar"
            src="${
              profile.avatar_url ||
              'https://i.pravatar.cc/150'
            }"
          >

          <div class="post-content">

            <div class="username">

              ${
                profile.username ||
                "user"
              }

              ${
                profile.verified_badge
                ?
                `
                  <img
                    src="${profile.verified_badge}"
                    class="blue-tick"
                  >
                `
                :
                ""
              }

            </div>

            <div class="caption">

              ${
                post.caption || ""
              }

            </div>

            ${
              post.image_url
              ?
              `
                <img
                  class="post-image"
                  src="${post.image_url}"
                >
              `
              :
              ""
            }

            <div class="post-actions">

              <span
                class="
                  material-icons
                  action-btn
                  like-btn
                  ${
                    liked
                    ?
                    "liked"
                    :
                    ""
                  }
                "
                data-post="${post.id}"
              >

                ${
                  liked
                  ?
                  "favorite"
                  :
                  "favorite_border"
                }

              </span>

            </div>

            <div
              class="counts"
              id="likes-${post.id}"
            >

              ${
                likesCount || 0
              } likes

            </div>

          </div>

        </div>

      </div>

    `

  }

  setupLikes()

}

// =====================
// LIKE SYSTEM
// =====================

async function setupLikes(){

  const {
    data:{ user }
  } =
  await supabaseClient
  .auth
  .getUser()

  const likeButtons =
  document.querySelectorAll(
    ".like-btn"
  )

  for(const btn of likeButtons){

    btn.addEventListener(
      "click",
      async ()=>{

        const postId =
        btn.dataset.post

        // =====================
        // UNLIKE
        // =====================

        if(
          btn.classList.contains(
            "liked"
          )
        ){

          await supabaseClient
          .from("likes")
          .delete()
          .eq("post_id", postId)
          .eq("user_id", user.id)

          btn.classList.remove(
            "liked"
          )

          btn.innerText =
          "favorite_border"

        }

        // =====================
        // LIKE
        // =====================

        else{

          await supabaseClient
          .from("likes")
          .insert([{

            post_id:postId,
            user_id:user.id

          }])

          btn.classList.add(
            "liked"
          )

          btn.innerText =
          "favorite"

        }

        // =====================
        // UPDATE COUNT
        // =====================

        const {
          count:newCount
        } =
        await supabaseClient
        .from("likes")
        .select("*",{
          count:"exact",
          head:true
        })
        .eq("post_id", postId)

        document.getElementById(
          `likes-${postId}`
        ).innerText =

        `${newCount || 0} likes`

      }
    )

  }

}

// =====================
// FOLLOW MODAL
// =====================

async function openFollowModal(type){

  if(type === "posts"){
    return
  }

  currentTab = type

  document.getElementById(
    "followModal"
  ).style.display = "flex"

  loadFollowUsers()

}

function closeFollowModal(){

  document.getElementById(
    "followModal"
  ).style.display = "none"

}

function switchTab(type){

  currentTab = type

  loadFollowUsers()

}

// =====================
// LOAD FOLLOW USERS
// =====================

async function loadFollowUsers(){

  const followList =
  document.getElementById(
    "followList"
  )

  document.getElementById(
    "followersTab"
  ).classList.remove(
    "active"
  )

  document.getElementById(
    "followingTab"
  ).classList.remove(
    "active"
  )

  if(currentTab === "followers"){

    document.getElementById(
      "followersTab"
    ).classList.add(
      "active"
    )

  }

  else{

    document.getElementById(
      "followingTab"
    ).classList.add(
      "active"
    )

  }

  followList.innerHTML =
  "Loading..."

  const {
    data:{ user:currentUser }
  } =
  await supabaseClient
  .auth
  .getUser()

  let followRows = []

  // =====================
  // FOLLOWERS
  // =====================

  if(currentTab === "followers"){

    const { data } =
    await supabaseClient
    .from("follows")
    .select("*")
    .eq("following_id", userId)

    followRows = data || []

  }

  // =====================
  // FOLLOWING
  // =====================

  else{

    const { data } =
    await supabaseClient
    .from("follows")
    .select("*")
    .eq("follower_id", userId)

    followRows = data || []

  }

  followList.innerHTML = ""

  if(followRows.length === 0){

    followList.innerHTML = `
      <div style="
        padding:30px;
        text-align:center;
        color:gray;
      ">
        No users found
      </div>
    `

    return

  }

  // =====================
  // USER LOOP
  // =====================

  for(const row of followRows){

    const targetId =
    currentTab === "followers"
    ?
    row.follower_id
    :
    row.following_id

    const {
      data:profile
    } =
    await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", targetId)
    .single()

    if(!profile){
      continue
    }

    const {
      data:isFollow
    } =
    await supabaseClient
    .from("follows")
    .select("*")
    .eq("follower_id", currentUser.id)
    .eq("following_id", targetId)
    .maybeSingle()

    followList.innerHTML += `

      <div class="follow-user">

        <a
          href="user-profile.html?id=${profile.id}"
          class="follow-left"
        >

          <img
            src="${
              profile.avatar_url ||
              'https://i.pravatar.cc/150'
            }"
            class="follow-avatar"
          >

          <div class="follow-info">

            <div class="follow-name">

              ${
                profile.username ||
                "user"
              }

              ${
                profile.verified_badge
                ?
                `
                  <img
                    src="${profile.verified_badge}"
                    class="blue-tick"
                  >
                `
                :
                ""
              }

            </div>

            <div class="follow-username">

              @${profile.username || "user"}

            </div>

          </div>

        </a>

        ${
          currentUser.id !== profile.id
          ?
          `
            <button
              class="
                follow-action
                ${
                  isFollow
                  ?
                  "following-btn"
                  :
                  ""
                }
              "
              onclick="
                toggleFollow(
                  '${profile.id}',
                  this
                )
              "
            >

              ${
                isFollow
                ?
                "Following"
                :
                "Follow"
              }

            </button>
          `
          :
          ""
        }

      </div>

    `

  }

}

// =====================
// TOGGLE FOLLOW
// =====================

async function toggleFollow(
  targetUserId,
  button
){

  const {
    data:{ user }
  } =
  await supabaseClient
  .auth
  .getUser()

  const isFollowing =
  button.innerText ===
  "Following"

  // =====================
  // UNFOLLOW
  // =====================

  if(isFollowing){

    await supabaseClient
    .from("follows")
    .delete()
    .eq("follower_id", user.id)
    .eq("following_id", targetUserId)

    button.innerText =
    "Follow"

    button.classList.remove(
      "following-btn"
    )

  }

  // =====================
  // FOLLOW
  // =====================

  else{

    await supabaseClient
    .from("follows")
    .insert([{

      follower_id:user.id,
      following_id:targetUserId

    }])

    // =====================
    // NOTIFICATION
    // =====================

    await createNotification({

      senderId:user.id,

      receiverId:targetUserId,

      type:"follow",

      message:"started following you"

    })

    button.innerText =
    "Following"

    button.classList.add(
      "following-btn"
    )

  }

}
</script>

</body>
</html>
